name: Android ARM64 bootstrap
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'launcher/prepare.*'
      - 'tests/test_update_metadata.cpp'
      - '.github/workflows/android-bootstrap.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test shared metadata reader
        run: |
          c++ -std=c++20 tests/test_update_metadata.cpp launcher/prepare.cpp -o /tmp/test-metadata
          /tmp/test-metadata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-android-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
