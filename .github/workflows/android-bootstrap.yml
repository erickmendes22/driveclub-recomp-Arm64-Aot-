name: Android Bionic FEX runtime
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'cpu/**'
      - 'gpu/**'
      - 'src/**'
      - 'tests/test_android_fex.cpp'
      - 'tests/test_android_runtime_io.c'
      - 'tests/test_runtime_memory.c'
      - 'launcher/prepare.*'
      - 'tests/test_update_metadata.cpp'
      - '.github/workflows/android-bootstrap.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test shared metadata reader
        run: |
          c++ -std=c++20 tests/test_update_metadata.cpp launcher/prepare.cpp -o /tmp/test-metadata
          /tmp/test-metadata
      - name: Test native file, input and memory contracts
        run: |
          cc -std=c11 -D__ANDROID__ -DDRIVECLUB_ANDROID_RUNTIME=1 -I. -Isrc tests/test_android_runtime_io.c src/runtime_file.c src/runtime_pad_android.c -pthread -lm -o /tmp/test-android-io
          /tmp/test-android-io
          cc -std=c11 -O2 -ffunction-sections -fdata-sections -pthread tests/test_runtime_memory.c -Wl,--gc-sections -o /tmp/test-runtime-memory
          /tmp/test-runtime-memory
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            out/android-fex
            out/android-gpu/source
            out/android-gpu/prefix
            out/android-gpu/host
          key: android-bionic-r29-${{ hashFiles('android/tools/fetch-gpu-deps.sh', 'android/tools/build-fex.sh', 'cpu/**') }}
      - name: Cross-compile Driveclub loader and HLE for Bionic
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" android/tools/build-runtime-core.sh
      - name: Build CPU and renderer dependencies for Android Bionic
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          mkdir -p out/build-logs
          android/tools/build-fex.sh >out/build-logs/fex.txt 2>&1 &
          fex_build_pid=$!
          android/tools/fetch-gpu-deps.sh >out/build-logs/gpu-dependencies.txt 2>&1 &
          gpu_build_pid=$!
          failed=0
          wait "$fex_build_pid" || failed=1
          wait "$gpu_build_pid" || failed=1
          if [ "$failed" -ne 0 ]; then
            tail -100 out/build-logs/fex.txt
            tail -100 out/build-logs/gpu-dependencies.txt
            exit 1
          fi
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Verify packaged Bionic runtime and dependency closure
        run: python3 android/tools/verify-apk.py android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-android-bionic-fex-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Extract the packaged FEX backend for the ARM64 execution test
        run: |
          mkdir -p out/fex-test
          unzip -j android/build/outputs/apk/debug/*.apk 'lib/arm64-v8a/libbbcpu.so' 'lib/arm64-v8a/libc++_shared.so' -d out/fex-test
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" tests/test_android_fex.cpp out/android-runtime/libdriveclub-runtime.a -Wl,--gc-sections -Lout/fex-test -lbbcpu -o out/fex-test/test-fex
      - uses: actions/upload-artifact@v4
        with:
          name: bionic-fex-test
          path: out/fex-test/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driveclub-native-build-logs
          path: out/build-logs/

  launcher:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - name: Build emulator test APK
        run: ./gradlew assembleDebug -PlauncherTestAbi=x86_64
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise launcher on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash android/smoke-launcher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-launcher-preview
          path: out/launcher-preview/*.png

  fex:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bionic-fex-test
          path: fex-test
      - name: Prepare official Android 11 Bionic runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
          python3 android/tools/fetch-bionic-runtime.py --output out/android-bionic
      - name: Execute x86-64 instructions with the packaged ARM64 Bionic backend
        run: |
          set -o pipefail
          chmod +x fex-test/test-fex
          python3 android/tools/run-bionic-test.py --runtime out/android-bionic fex-test/test-fex | tee fex-test/validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bionic-fex-validation
          path: fex-test/validation.txt
