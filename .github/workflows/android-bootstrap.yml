name: Android ARM64 bootstrap
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'cpu/**'
      - 'launcher/prepare.*'
      - 'tests/test_update_metadata.cpp'
      - '.github/workflows/android-bootstrap.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test shared metadata reader
        run: |
          c++ -std=c++20 tests/test_update_metadata.cpp launcher/prepare.cpp -o /tmp/test-metadata
          /tmp/test-metadata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 build-tools;34.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Build Driveclub CPU bridge for Android Bionic
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" android/tools/build-fex.sh
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-android-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Build emulator test APK
        run: ./gradlew assembleDebug -PlauncherTestAbi=x86_64
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise launcher on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash android/smoke-launcher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-launcher-preview
          path: out/launcher-preview/*.png
