name: Android Bionic FEX runtime
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'cpu/**'
      - 'gpu/**'
      - 'src/**'
      - 'tests/test_android_fex.cpp'
      - 'tests/test_android_runtime_io.c'
      - 'tests/test_runtime_memory.c'
      - 'tests/test_runtime_services.c'
      - 'tests/test_runtime_usbd.c'
      - 'tests/test_runtime_thread_contracts.c'
      - 'tests/test_runtime_modules.c'
      - 'tests/test_runtime_capture.c'
      - 'tests/test_guest_setcontext.c'
      - 'tests/guest_setcontext*'
      - 'tests/test_image_codecs.cpp'
      - 'tests/test_import_audit.py'
      - 'tests/test_android_imports.cpp'
      - 'tests/test_gpu_mapped_ranges.cpp'
      - 'tests/fixtures/**'
      - 'tools/audit-imports.py'
      - 'tools/generate-setcontext.py'
      - 'tools/generate-provider-cases.py'
      - 'launcher/prepare.*'
      - 'tests/test_update_metadata.cpp'
      - '.github/workflows/android-bootstrap.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test shared metadata reader
        run: |
          c++ -std=c++20 tests/test_update_metadata.cpp launcher/prepare.cpp -o /tmp/test-metadata
          /tmp/test-metadata
      - name: Test native file, input and memory contracts
        run: |
          cc -std=c11 -D__ANDROID__ -DDRIVECLUB_ANDROID_RUNTIME=1 -I. -Isrc tests/test_android_runtime_io.c src/runtime_file.c src/runtime_pad_android.c -pthread -lm -o /tmp/test-android-io
          /tmp/test-android-io
          cc -std=c11 -O2 -ffunction-sections -fdata-sections -pthread tests/test_runtime_memory.c -Wl,--gc-sections -o /tmp/test-runtime-memory
          /tmp/test-runtime-memory
      - name: Test service, content, dialog, RTC and USB contracts
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -pthread -I. tests/test_runtime_services.c src/runtime.c src/runtime_services.c src/runtime_ss.c src/runtime_content.c src/runtime_rtc.c src/runtime_file.c src/runtime_cpu.c src/runtime_low_memory.c -Wl,--gc-sections -o /tmp/test-runtime-services
          /tmp/test-runtime-services
          cc -std=c11 -O2 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -pthread -I. tests/test_runtime_usbd.c src/runtime.c src/runtime_usbd.c src/runtime_low_memory.c -Wl,--gc-sections -o /tmp/test-runtime-usbd
          /tmp/test-runtime-usbd
          cc -std=c11 -D_GNU_SOURCE -O2 -Wall -Wextra -ffunction-sections -fdata-sections -I. tests/test_runtime_capture.c src/runtime_capture.c src/runtime.c -Wl,--gc-sections -pthread -o /tmp/test-runtime-capture
          /tmp/test-runtime-capture
      - name: Test guest context restoration and verify generated instructions
        run: |
          python3 tools/generate-setcontext.py --check
          python3 tools/generate-setcontext.py --fixture --check
          cc -std=c11 -O2 -Wall -Wextra -I. -Isrc tests/test_guest_setcontext.c src/runtime_cpu.c src/runtime_low_memory.c -pthread -o /tmp/test-guest-setcontext
          /tmp/test-guest-setcontext
      - name: Test thread cleanup and linked module lifecycle
        run: |
          cc -std=c11 -O2 -Wall -Wextra -ffunction-sections -fdata-sections -I. -Isrc tests/test_runtime_thread_contracts.c src/runtime_cpu.c src/runtime_low_memory.c -Wl,--gc-sections -Wl,--wrap=nanosleep -pthread -o /tmp/test-runtime-threads
          /tmp/test-runtime-threads
          cc -std=c11 -O2 -Wall -Wextra -ffunction-sections -fdata-sections -I. -Isrc tests/test_runtime_modules.c -Wl,--gc-sections -pthread -lm -o /tmp/test-runtime-modules
          /tmp/test-runtime-modules
      - name: Test import auditing with synthetic metadata and public providers
        run: |
          python3 tests/test_import_audit.py
      - name: Test control and shutdown hooks with a synthetic x86 image
        run: |
          mkdir -p out/exit-regression
          for source in src/runtime_exit.c src/runtime_cpu.c src/runtime_low_memory.c src/runtime_memory.c; do
            cc -std=c11 -O2 -Wall -Wextra -ffunction-sections -fdata-sections -I. -c "$source" -o "out/exit-regression/$(basename "${source%.c}").o"
          done
          c++ -std=c++20 -O2 -ffunction-sections -fdata-sections -DDRIVECLUB_NATIVE_EXIT_TEST=1 tests/test_android_fex.cpp out/exit-regression/*.o -Wl,--gc-sections -Wl,--wrap=mmap -Wl,--wrap=guest_cpu_call -pthread -o out/exit-regression/test-exit
          out/exit-regression/test-exit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            out/android-fex
            out/android-gpu/source
            out/android-gpu/prefix
            out/android-gpu/host
          key: android-bionic-r29-${{ hashFiles('android/tools/fetch-gpu-deps.sh', 'android/tools/build-fex.sh', 'cpu/**') }}
      - name: Cross-compile Driveclub loader and HLE for Bionic
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" android/tools/build-runtime-core.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/pkg-tests
            out/android-pkg
          key: android-pkg-rust185-arm64-${{ hashFiles('android/pkg/**', 'android/tools/build-pkg.sh') }}
      - name: Test PKG extraction and build the ARM64 installer
        run: |
          bash android/tools/build-pkg.sh --test-only
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash android/tools/build-pkg.sh --abi arm64-v8a
      - name: Bundle the pinned Turnip Gen8 V39-patched driver
        run: python3 android/tools/fetch-turnip.py
      - name: Build CPU and renderer dependencies for Android Bionic
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          mkdir -p out/build-logs
          android/tools/build-fex.sh >out/build-logs/fex.txt 2>&1 &
          fex_build_pid=$!
          android/tools/fetch-gpu-deps.sh >out/build-logs/gpu-dependencies.txt 2>&1 &
          gpu_build_pid=$!
          failed=0
          wait "$fex_build_pid" || failed=1
          wait "$gpu_build_pid" || failed=1
          if [ "$failed" -ne 0 ]; then
            tail -100 out/build-logs/fex.txt
            tail -100 out/build-logs/gpu-dependencies.txt
            exit 1
          fi
      - name: Test selected Vulkan dispatch and driver switching
        run: bash android/tools/test-vulkan-dispatch.sh
      - name: Test physical mappings and sparse PRT coverage
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Iout/android-gpu/prefix/include tests/test_gpu_mapped_ranges.cpp -o out/test-gpu-mapped-ranges
          out/test-gpu-mapped-ranges
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Verify packaged Bionic runtime and dependency closure
        run: python3 android/tools/verify-apk.py android/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-android-bionic-fex-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Extract the packaged FEX backend for the ARM64 execution test
        run: |
          mkdir -p out/fex-test
          unzip -j android/build/outputs/apk/debug/*.apk 'lib/arm64-v8a/libbbcpu.so' 'lib/arm64-v8a/libc++_shared.so' 'lib/arm64-v8a/libdriveclub_game.so' 'lib/arm64-v8a/libdriveclub_vulkan.so' -d out/fex-test
          runtime_archive="$(python3 -c 'from pathlib import Path; archives=list(Path("android/.cxx").glob("**/arm64-v8a/libdriveclub_runtime.a")); assert len(archives) == 1, archives; print(archives[0])')"
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" tests/test_android_fex.cpp "$runtime_archive" -Wl,--gc-sections -Wl,--wrap=mmap -Wl,--wrap=guest_cpu_call -Lout/fex-test -lbbcpu -o out/fex-test/test-fex
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" -std=c++20 tests/test_android_imports.cpp -ldl -o out/fex-test/test-imports
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" -std=c++20 -O2 -Wall -Wextra -Igpu/shadps4 -Iout/android-gpu/prefix/include tests/test_image_codecs.cpp gpu/bbnet/jpeg_dec.cpp gpu/bbnet/png_enc.cpp out/android-gpu/prefix/lib/libpng16.a -lz -o out/fex-test/test-image-codecs
      - uses: actions/upload-artifact@v4
        with:
          name: bionic-fex-test
          path: out/fex-test/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driveclub-native-build-logs
          path: out/build-logs/

  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            out/pkg-tests
            out/android-pkg
          key: android-pkg-rust185-x86_64-${{ hashFiles('android/pkg/**', 'android/tools/build-pkg.sh') }}
      - name: Prepare driver assets and the emulator PKG installer
        run: |
          python3 android/tools/fetch-turnip.py
          bash android/tools/build-pkg.sh --fixtures
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" bash android/tools/build-pkg.sh --abi x86_64
      - name: Build emulator test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PlauncherTestAbi=x86_64
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise launcher on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash android/smoke-launcher.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driveclub-launcher-preview
          path: out/launcher-preview/

  fex:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bionic-fex-test
          path: fex-test
      - name: Prepare official Android 11 Bionic runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
          python3 android/tools/fetch-bionic-runtime.py --output out/android-bionic --platform-libraries
      - name: Execute x86-64 instructions with the packaged ARM64 Bionic backend
        run: |
          set -o pipefail
          chmod +x fex-test/test-fex
          python3 android/tools/run-bionic-test.py --runtime out/android-bionic fex-test/test-fex | tee fex-test/validation.txt
      - name: Check declared public providers against the linked APK library
        run: |
          set -o pipefail
          chmod +x fex-test/test-imports
          python3 android/tools/run-bionic-test.py --runtime out/android-bionic fex-test/test-imports | tee fex-test/import-validation.txt
      - name: Execute JPEG and PNG codec contracts on Bionic ARM64
        run: |
          set -o pipefail
          chmod +x fex-test/test-image-codecs
          python3 android/tools/run-bionic-test.py --runtime out/android-bionic fex-test/test-image-codecs | tee fex-test/codec-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bionic-fex-validation
          path: |
            fex-test/validation.txt
            fex-test/import-validation.txt
            fex-test/codec-validation.txt
