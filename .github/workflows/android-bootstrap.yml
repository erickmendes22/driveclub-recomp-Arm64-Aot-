name: Android ARM64 bootstrap
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'cpu/**'
      - 'src/**'
      - 'tests/test_android_fex.cpp'
      - 'launcher/prepare.*'
      - 'tests/test_update_metadata.cpp'
      - '.github/workflows/android-bootstrap.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test shared metadata reader
        run: |
          c++ -std=c++20 tests/test_update_metadata.cpp launcher/prepare.cpp -o /tmp/test-metadata
          /tmp/test-metadata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 build-tools;34.0.0 ndk;29.0.14206865 cmake;3.22.1'
      - name: Cross-compile Driveclub loader and HLE for Bionic
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" android/tools/build-runtime-core.sh
      - name: Build Driveclub CPU bridge for Android Bionic
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" android/tools/build-fex.sh
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-android-arm64-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Extract the packaged FEX backend for the ARM64 execution test
        run: |
          mkdir -p out/fex-test
          unzip -j android/build/outputs/apk/debug/*.apk 'lib/arm64-v8a/libbbcpu.so' 'lib/arm64-v8a/libc++_shared.so' -d out/fex-test
          "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++" tests/test_android_fex.cpp out/android-runtime/libdriveclub-runtime.a -Wl,--gc-sections -Lout/fex-test -lbbcpu -o out/fex-test/test-fex
      - uses: actions/upload-artifact@v4
        with:
          name: bionic-fex-test
          path: out/fex-test/
      - name: Build emulator test APK
        run: ./gradlew assembleDebug -PlauncherTestAbi=x86_64
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise launcher on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash android/smoke-launcher.sh
      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-launcher-preview
          path: out/launcher-preview/*.png

  fex:
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bionic-fex-test
          path: fex-test
      - name: Execute x86-64 instructions with the packaged ARM64 Bionic backend
        run: |
          chmod +x fex-test/test-fex
          docker run --rm --network none -v "$PWD/fex-test:/test:ro" \
              -e HOME=/tmp -e LD_LIBRARY_PATH=/test --entrypoint /test/test-fex termux/termux-docker:aarch64
