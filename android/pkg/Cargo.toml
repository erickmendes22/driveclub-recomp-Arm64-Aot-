[package]
name = "driveclub-pkg-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-2.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[workspace]
resolver = "3"
members = ["vendor/orbis-pkg", "vendor/orbis-pfs"]

[workspace.package]
authors = ["videobitva"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/videobitva/orbis"
homepage = "https://github.com/videobitva/orbis"

[workspace.dependencies]
aes = "0.8.4"
sha2 = "0.10.9"
snafu = "0.8.9"
zerocopy = "0.8.38"

[dependencies]
orbis-pkg = { path = "vendor/orbis-pkg" }
orbis-pfs = { path = "vendor/orbis-pfs" }
libc = "0.2.172"
memmap2 = "0.9.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2.workspace = true

[dev-dependencies]
aes.workspace = true
cbc = "0.1.2"
flate2 = "1.1.9"
hmac = "0.12.1"
rand = "0.8.5"
rsa = "0.9.8"
xts-mode = "0.5.1"

[profile.release]
opt-level = 3
panic = "unwind"
strip = "debuginfo"
